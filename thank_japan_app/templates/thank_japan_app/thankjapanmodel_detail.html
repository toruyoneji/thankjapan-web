{% extends 'base/base_detail.html' %}
{% load category_filters %}
{% block title %}{{ seo_title }}{% endblock %}

{% block meta %}
    <meta name="description" content="{{ seo_description }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ seo_title }}">
    <meta name="twitter:description" content="{{ seo_description }}">

    {% if object.image %}
        <meta name="twitter:image" content="{{ object.image.url }}">
        <meta property="og:image" content="{{ object.image.url }}">
    {% else %}
        <meta name="twitter:image" content="https://res.cloudinary.com/dotekofm5/image/upload/f_auto,q_auto/v1768385674/thankjapan/backgrounds/gx8xbypllgs1qogcsvak.jpg">
        <meta property="og:image" content="https://res.cloudinary.com/dotekofm5/image/upload/f_auto,q_auto/v1768385674/thankjapan/backgrounds/gx8xbypllgs1qogcsvak.jpg">
    {% endif %}

    <meta property="og:title" content="{{ seo_title }}" />
    <meta property="og:description" content="{{ seo_description }}" />
    <meta property="og:url" content="{{ request.build_absolute_uri }}" />
    <meta property="og:type" content="article" />
{% endblock %}

{% block detail_main %}
{% include 'thank_japan_app/thankjapanmodel_detail_body.html' %}
{% endblock %}

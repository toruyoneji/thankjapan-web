{% load static %}
<!-- Preconnect/dns-prefetch for every cross-origin host this page's render-
     blocking CSS (below) and hero images depend on (LCP investigation,
     2026-09-20) - none of these existed before, so each origin paid full
     DNS+TCP+TLS setup cost serially, on top of the render-blocking CSS
     chain itself. Placed first, before any other <head> content, so the
     browser starts the handshakes as early as possible. fonts.gstatic.com
     needs crossorigin since font files are fetched CORS-mode. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://res.cloudinary.com">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://fonts.gstatic.com">
<link rel="dns-prefetch" href="https://res.cloudinary.com">

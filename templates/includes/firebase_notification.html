<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

<script>

const FCM_CONFIG = {
    apiKey: "{{ FIREBASE_API_KEY }}",
    authDomain: "{{ FIREBASE_PROJECT_ID }}.firebaseapp.com",
    projectId: "{{ FIREBASE_PROJECT_ID }}",
    storageBucket: "{{ FIREBASE_PROJECT_ID }}.firebasestorage.app",
    messagingSenderId: "{{ FIREBASE_MESSAGING_SENDER_ID }}",
    appId: "{{ FIREBASE_APP_ID }}"
};
const FCM_VAPID_KEY = "{{ FIREBASE_VAPID_KEY }}";
const FCM_LANG = "{{ lang_code }}";

function getFcmMessaging() {
    if (!firebase.apps.length) {
        firebase.initializeApp(FCM_CONFIG);
    }
    return firebase.messaging();
}

// Requests browser notification permission (a no-op prompt if the user already
// answered) and, if granted, fetches an FCM token and saves it server-side.
// Resolves to 'granted' / 'denied' / 'default' / 'unsupported' / 'error'.
// Shared by the unconditional auto-prompt below (setupNotifications) and any
// explicit opt-in flow - e.g. the Daily Question notification toggle's soft
// ask in templates/includes/daily_question_notify_toggle.html - that wants
// the same permission + token setup without duplicating this logic.
async function requestNotificationPermissionAndSaveToken() {
    if (!('serviceWorker' in navigator) || !('Notification' in window)) return 'unsupported';
    try {
        const registration = await navigator.serviceWorker.ready;
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') return permission;

        const messaging = getFcmMessaging();
        const token = await messaging.getToken({
            vapidKey: FCM_VAPID_KEY,
            serviceWorkerRegistration: registration
        });

        if (token) {
            await fetch('/api/save-fcm-token/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({token: token, lang: FCM_LANG})
            });
        }
        return 'granted';
    } catch (error) {
        console.log("FCM setup error:", error);
        return 'error';
    }
}

if (typeof isFcmAlreadyRunning === 'undefined') {
    var isFcmAlreadyRunning = false;
}

async function setupNotifications() {
    if (isFcmAlreadyRunning) return;
    isFcmAlreadyRunning = true;

    await requestNotificationPermissionAndSaveToken();

    try {
        const messaging = getFcmMessaging();
        messaging.onMessage((payload) => {
            console.log('Foreground message:', payload);
            new Notification(payload.notification.title, {
                body: payload.notification.body,
                icon: '/static/images/pwa-icon-192.png'
            });
        });
    } catch (error) {
        console.log("FCM waiting for ready...");
    }
}


window.addEventListener('load', () => {
    setTimeout(setupNotifications, 2000);
});
</script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

<script>

if (typeof isFcmAlreadyRunning === 'undefined') {
    var isFcmAlreadyRunning = false;
}

async function setupNotifications() {
    if (isFcmAlreadyRunning) return; 
    isFcmAlreadyRunning = true;

    const firebaseConfig = {
        apiKey: "{{ FIREBASE_API_KEY }}",
        authDomain: "{{ FIREBASE_PROJECT_ID }}.firebaseapp.com",
        projectId: "{{ FIREBASE_PROJECT_ID }}",
        storageBucket: "{{ FIREBASE_PROJECT_ID }}.firebasestorage.app",
        messagingSenderId: "{{ FIREBASE_MESSAGING_SENDER_ID }}",
        appId: "{{ FIREBASE_APP_ID }}"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const messaging = firebase.messaging();

    try {
        if (!('serviceWorker' in navigator)) return;

        
        const registration = await navigator.serviceWorker.ready;
        
        
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
            const token = await messaging.getToken({
                vapidKey: "{{ FIREBASE_VAPID_KEY }}",
                serviceWorkerRegistration: registration
            });

            if (token) {
                await fetch('/api/save-fcm-token/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token: token, lang: "{{ lang_code }}"})
                });
                console.log("FCM Setup Complete.");
            }
        }
        
        
        messaging.onMessage((payload) => {
            console.log('Foreground message:', payload);
            new Notification(payload.notification.title, {
                body: payload.notification.body,
                icon: '/static/images/pwa-icon-192.png'
            });
        });

    } catch (error) {
        console.log("FCM waiting for ready...");
    }
}


window.addEventListener('load', () => {
    setTimeout(setupNotifications, 2000);
});
</script>

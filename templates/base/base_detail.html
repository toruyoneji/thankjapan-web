{% extends 'base/basecategory_top.html' %}

{% block content %}
<div id="premium-auth-container" class="{% if is_modal %}modal-layout{% else %}direct-layout{% endif %}">
    <div class="app-content-fix">
        {% block detail_main %}{% endblock %}
    </div>
</div>

<style>

#premium-auth-container.modal-layout {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100dvh;
    background: #0a0a0a; 
    overflow: hidden;
    z-index: 9999;
}


#premium-auth-container.direct-layout {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: #0a0a0a;
    display: flex;
    justify-content: center; 
}


.app-content-fix {
    width: 100%;
    max-width: 800px; 
    height: 100%;
    overflow-y: auto; 
    -webkit-overflow-scrolling: touch;
    padding-top: 70px;    
    padding-bottom: 120px; 
}

.app-content-fix::-webkit-scrollbar { display: none; }

html.modal-embed .app-content-fix {
    padding-top: 20px !important;
    padding-bottom: 24px !important;
}

</style>
{% endblock %}
